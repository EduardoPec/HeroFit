<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pagamento - HeroFit</title>
    <link rel="stylesheet" href="../static/css/planos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .payment-container {
            padding: 15vh 2rem 5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .payment-form {
            background: rgba(17, 17, 17, 0.9);
            border-radius: 15px;
            padding: 4rem;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(103, 71, 163, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .payment-form::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #6747a3, #9d6df9);
        }

        .payment-form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(103, 71, 163, 0.4);
            border-color: #9d6df9;
        }

        .payment-title {
            font-size: 2.8rem;
            color: white;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.2rem;
            position: relative;
        }

        .payment-title::after {
            content: "";
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, transparent, #6747a3, transparent);
        }

        .form-group {
            margin-bottom: 2.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 1.6rem;
            color: #b39ddb;
            margin-bottom: 1rem;
            letter-spacing: 0.1rem;
        }

        .form-group input {
            width: 100%;
            padding: 1.5rem;
            background: rgba(34, 34, 34, 0.7);
            border: 1px solid rgba(103, 71, 163, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1.6rem;
            font-family: "Poppins", sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #9d6df9;
            box-shadow: 0 0 15px rgba(103, 71, 163, 0.3);
        }

        .form-group input:hover {
            border-color: #9d6df9;
            transform: scale(1.04);  
            transition: 0.6s;
        }

        .form-group input::placeholder {
            color: #666;
            font-size: 1.4rem;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 1.3rem;
            margin-top: 0.5rem;
            display: none;
        }

        .payment-btn {
            display: block;
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(to right top, #9d6df9, #222222);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
            box-shadow: 0 5px 15px rgba(103, 71, 163, 0.3);
        }

        .payment-btn:hover {
            transform: scale(1.04);  
            transition: 0.6s;
        }

        .payment-btn i {
            margin-left: 0.5rem;
            transition: all 0.3s ease;
        }

        .payment-btn:hover i {
            transform: translateX(3px);
        }

        @media (max-width: 768px) {
            .payment-form {
                padding: 3rem;
            }
            
            .payment-title {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 480px) {
            .payment-form {
                padding: 2.5rem 2rem;
            }
            
            .payment-title {
                font-size: 2rem;
            }
            
            .form-group input {
                padding: 1.2rem;
            }
            
            .payment-btn {
                padding: 1.2rem;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="menu">
            <div class="logo">Hero<span>Fit</span></div>
    </header>

    <div class="payment-container">
        <form id="paymentForm" class="payment-form">
            <h1 class="payment-title">Formulário de <span>Pagamento</span></h1>
            
            <div class="form-group">
                <label for="plan"><i class="fas fa-tag"></i> Plano Selecionado:</label>
                <input type="text" id="plan" name="plan" readonly placeholder="Seu plano aparecerá aqui">
            </div>

            <div class="form-group">
                <label for="name"><i class="fas fa-user"></i> Nome Completo:</label>
                <input type="text" id="name" name="name" required placeholder="Digite seu nome completo">
                <div class="error-message" id="name-error">O nome deve ter no mínimo 3 caracteres</div>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
                <div class="error-message" id="email-error">Por favor, insira um e-mail válido</div>
            </div>

            <div class="form-group">
                <label for="card-number"><i class="fas fa-credit-card"></i> Número do Cartão:</label>
                <input type="text" id="card-number" name="card-number" required placeholder="0000 0000 0000 0000">
                <div class="error-message" id="card-error">O número do cartão deve conter 16 dígitos</div>
            </div>

            <div class="form-group">
                <label for="expiry-date"><i class="fas fa-calendar-alt"></i> Data de Validade:</label>
                <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/AA" required>
                <div class="error-message" id="expiry-error">Formato inválido (MM/AA)</div>
            </div>

            <div class="form-group">
                <label for="cvv"><i class="fas fa-lock"></i> Código de Segurança (CVV):</label>
                <input type="text" id="cvv" name="cvv" required placeholder="123">
                <div class="error-message" id="cvv-error">O CVV deve conter 3 dígitos</div>
            </div>

            <button type="submit" class="payment-btn">Confirmar Pagamento <i class="fas fa-arrow-right"></i></button>
        </form>
    </div>

    <script src="../static/js/pagamento.js"></script>
</body>
</html>
