<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - HeroFit</title>
    <script src="https://kit.fontawesome.com/43d6fb86d2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo-header">
                <h1>Hero<span>Fit</span></h1>
                <p>Crie sua conta e comece sua jornada fitness</p>
            </div>
            
            <form class="register-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" placeholder="Digite seu telefone" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Crie uma senha" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Confirme sua senha" required>
                </div>
                
                <div class="terms">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        <span>Eu concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a></span>
                    </label>
                </div>
                
                <button type="submit" class="register-btn">Criar Conta <i class="fas fa-arrow-right"></i></button>
            </form>
            
            <div class="login-link">
                <p>Já tem uma conta? <a href="/Login HeroFit/index.html">Faça login</a></p>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Validação dos campos pode ser adicionada aqui
            window.location.href = '/Questionário HeroFit/index.html';
        });
    </script>
</body>
</html>
